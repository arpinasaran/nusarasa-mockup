<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Mockup Form v3</title>
<style>
:root{
  --bg:#f6f4f3; --surface:#ffffff; --surface-2:#faf8f7; --text:#1d1b1b; --muted:#6c6567;
  --line:#e6e0df; --line-strong:#d3c9c8;
  --accent:#c8102e; --accent-strong:#a00d25; --accent-soft:#fdeef0; --accent-line:#f1c3ca; --on-accent:#ffffff;
  --ok:#1f6b3a; --ok-soft:#e8f4ec; --warn:#8a5a0f; --warn-soft:#fff5de; --info:#1d5a85; --info-soft:#e7f1f9;
  --shadow:rgba(30,15,15,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141213; --surface:#1d1a1b; --surface-2:#242021; --text:#eeeaea; --muted:#a59d9f;
    --line:#332e2f; --line-strong:#4a4243;
    --accent:#ff6378; --accent-strong:#ff8696; --accent-soft:#3a1d23; --accent-line:#6d2c37; --on-accent:#1b0b0e;
    --ok:#86d6a0; --ok-soft:#18301f; --warn:#f0c46a; --warn-soft:#33290f; --info:#8cc4ef; --info-soft:#152a3a;
    --shadow:rgba(0,0,0,.35); color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#141213; --surface:#1d1a1b; --surface-2:#242021; --text:#eeeaea; --muted:#a59d9f;
  --line:#332e2f; --line-strong:#4a4243;
  --accent:#ff6378; --accent-strong:#ff8696; --accent-soft:#3a1d23; --accent-line:#6d2c37; --on-accent:#1b0b0e;
  --ok:#86d6a0; --ok-soft:#18301f; --warn:#f0c46a; --warn-soft:#33290f; --info:#8cc4ef; --info-soft:#152a3a;
  --shadow:rgba(0,0,0,.35); color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--text);display:flex;flex-direction:column;height:100dvh;overflow:hidden;
  font:15px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.btn{border:1px solid var(--line-strong);background:var(--surface);border-radius:8px;padding:7px 14px;font-size:14px}
.btn:hover:not(:disabled){border-color:var(--accent)}
.btn:disabled{opacity:.4;cursor:default}
.btn.utama{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:600}
.btn.utama:hover:not(:disabled){background:var(--accent-strong);border-color:var(--accent-strong)}
.btn.tipis{border-color:transparent;background:none;color:var(--muted);padding:5px 8px;font-size:13px}
.btn.tipis:hover:not(:disabled){color:var(--accent)}
.btn.tipis.on{color:var(--accent);font-weight:600}

/* header */
header{flex:none;background:var(--surface);border-bottom:1px solid var(--line)}
header .isi{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;padding:8px 16px}
header h1{font-size:15px;margin:0;font-weight:700;margin-right:auto}
header h1 span{color:var(--accent)}
.navteks{display:flex;align-items:center;gap:6px;font-size:14px}
.navteks .btn{padding:4px 10px}
.navteks .pos b{font-weight:700}
.navteks .pos small{color:var(--muted)}
.panduan{font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
.panduan:hover{text-decoration:underline}
.demo{display:flex;align-items:center;gap:2px;border-left:1px solid var(--line);padding-left:10px;font-size:12px;color:var(--muted)}

/* dua kolom */
main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px;padding:16px;max-width:1280px;width:100%;margin:0 auto}
@media (max-width:860px){main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);gap:10px;padding:10px 16px}}
.kiri{min-height:0;overflow:auto}
@media (max-width:860px){.kiri{max-height:40dvh}}
.meta{font-size:13px;color:var(--muted);margin:0 2px 8px}
.meta b{color:var(--text);font-weight:600}
.inst{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px 24px 0;box-shadow:0 2px 10px var(--shadow);overflow:hidden}
@media (max-width:640px){.inst{padding:14px 14px 0}}
.bag{margin-bottom:14px}
.bag-k{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700;margin-bottom:3px}
.bag-v{font-size:19px;line-height:1.6;overflow-wrap:anywhere}
@media (max-width:640px){.bag-v{font-size:17px}}
.labelrow{margin:0 -24px;padding:11px 24px;border-top:1px solid var(--line);background:var(--surface-2);display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline;font-size:14px;color:var(--muted)}
@media (max-width:640px){.labelrow{margin:0 -14px;padding:10px 14px}}
.labelrow .v{font-size:15px;font-weight:700;color:var(--text)}

/* kartu pertanyaan */
.kanan{min-height:0;display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:0 2px 10px var(--shadow)}
.stepper{flex:none;display:flex;gap:4px;padding:10px 12px;border-bottom:1px solid var(--line);overflow-x:auto}
.stepper button{flex:none;border:0;background:none;border-radius:999px;padding:4px 10px;font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:center}
.stepper button .n{width:20px;height:20px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}
.stepper button.ini{background:var(--accent-soft);color:var(--accent-strong);font-weight:600}
.stepper button.ini .n{border-color:var(--accent);color:var(--accent)}
.stepper button.beres .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.stepper button:disabled{cursor:default;opacity:.5}
.stepper small{font-weight:400;opacity:.8}
.qbody{flex:1;min-height:0;overflow:auto;padding:16px 18px}
.qfoot{flex:none;display:flex;justify-content:space-between;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.tanya{font-size:17px;font-weight:650;margin:0 0 4px;line-height:1.4}
.bantu{font-size:13px;color:var(--muted);margin:0 0 10px}
.d{font-size:12.5px;color:var(--muted)}
.jarak{height:10px}

.opsi{display:grid;gap:7px}
.opsi button{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 12px}
.opsi button:hover:not(:disabled){border-color:var(--accent-line)}
.opsi .bul{flex:none;width:16px;height:16px;border-radius:50%;border:1.5px solid var(--line-strong);margin-top:2px}
.opsi button.on{border-color:var(--accent);background:var(--accent-soft)}
.opsi button.on .bul{border:5px solid var(--accent)}
.opsi .t{font-weight:600;font-size:14.5px}
.opsi .catat{font-size:12.5px;color:var(--muted)}
.opsi .key{margin-left:auto;font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:4px;padding:0 5px;align-self:center}
@media (max-width:640px){.opsi .key{display:none}}
.lewati{margin-top:8px}
.sub{font-size:13.5px;color:var(--muted);margin:0 0 10px}
.stop{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-top:12px;font-size:14px}
.stop b{display:block;margin-bottom:6px}
textarea,input[type=text],select{width:100%;border:1px solid var(--line-strong);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--surface)}
textarea{min-height:52px;resize:vertical}
textarea:focus,input[type=text]:focus,select:focus{outline:2px solid var(--accent-line);border-color:var(--accent)}

/* langkah 2: lima baris */
.baris{border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:var(--surface)}
.baris.aktif{border-color:var(--accent-line);box-shadow:0 1px 6px var(--shadow)}
.baris-h{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:9px 12px;text-align:left;border-radius:10px}
.baris-h:hover{background:var(--surface-2)}
.baris-h .n{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--line-strong);display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:700;color:var(--muted)}
.baris.aktif .baris-h .n{border-color:var(--accent);color:var(--accent)}
.baris.isi:not(.aktif) .baris-h .n{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.baris-h .nm{font-weight:650;font-size:14.5px}
.baris-h .q{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.baris-h .q{display:none}}
.baris-b{padding:0 12px 12px}
.chip{margin-left:auto;flex:none;font-size:12px;font-weight:600;border-radius:999px;padding:1px 10px;white-space:nowrap}
.chip.tidak{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip.id{background:var(--ok-soft);color:var(--ok)}
.chip.daerah{background:var(--info-soft);color:var(--info)}
.chip.asing{background:var(--warn-soft);color:var(--warn)}
.chip.umum{background:var(--surface-2);color:var(--text);border:1px solid var(--line-strong)}
.chip.tt{background:none;color:var(--muted);border:1px dashed var(--line-strong)}

/* ringkasan */
.blok{margin-bottom:18px}
.blok:last-child{margin-bottom:0}
.ringkasan{font-size:13.5px;border:1px solid var(--line);border-radius:10px;padding:4px 12px;margin:0 0 12px}
.ringkasan div{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-top:1px solid var(--line)}
.ringkasan div:first-child{border-top:0}
.ringkasan span:first-child{color:var(--muted)}
.ringkasan span.v{font-weight:600;text-align:right}
.ringkasan .chip{margin-left:0}
</style>
</head>
<body>
<header><div class="isi">
  <h1>NusaRasa <span>Anotasi</span></h1>
  <div class="navteks">
    <button class="btn" id="tPrev" title="Teks sebelumnya">‹</button>
    <span class="pos" id="posisi"></span>
    <button class="btn" id="tNext" title="Teks berikutnya">›</button>
  </div>
  <a class="panduan" href="https://arpinasaran.github.io/nusarasa-mockup/v3/briefing.html" target="_blank" rel="noopener">Panduan ↗</a>
  <div class="demo">Demo:
    <button class="btn tipis" id="btnContoh">Isi contoh</button>
    <button class="btn tipis" id="btnReset">Kosongkan</button>
  </div>
</div></header>

<main>
  <section class="kiri" id="kiri"></section>
  <section class="kanan">
    <nav class="stepper" id="stepper"></nav>
    <div class="qbody" id="qbody"></div>
    <div class="qfoot">
      <button class="btn" id="qPrev">‹ Sebelumnya</button>
      <button class="btn utama" id="qNext">Lanjut ›</button>
    </div>
  </section>
</main>

<script>
const TASKS = {
  toksisitas: {nama: "Klasifikasi toksisitas", desk: "menentukan apakah unggahan mengandung ujaran kasar, hinaan, ancaman, atau serangan terhadap kelompok."},
  emosi: {nama: "Klasifikasi emosi", desk: "menentukan emosi yang paling menonjol di teks: senang, sedih, marah, takut, atau cinta."},
  nli: {nama: "Natural Language Inference", desk: "menentukan apakah hipotesis pasti benar, mungkin benar, atau pasti salah kalau premisnya benar."},
  qa: {nama: "Tanya jawab", desk: "mencari jawaban pertanyaan di dalam paragraf, atau menyatakan bahwa paragrafnya tidak memuat jawaban."}
};

// Pilihan jawaban v3. Arti tiap pilihan ada di deck briefing, bukan di form.
// Nama, Konsep, Perilaku: dari yang paling umum ke paling spesifik, lalu tidak ada (masukan Pak Fajri, 23 Okt).
// Kalau ada beberapa hal dalam satu baris, pilih yang paling bawah sebelum "Tidak ada" (yang paling spesifik).
const SKALA_FAMILIAR = unsur => [
  ["umum", "Familiar secara umum, di Indonesia maupun di luar negeri"],
  ["id", "Familiar hanya di Indonesia"],
  ["daerah", "Familiar hanya bagi komunitas Indonesia tertentu", "komunitas kultural"],
  ["asing", "Asing, tidak familiar di Indonesia"],
  ["tidak", `Tidak ada unsur ${unsur} dalam teks`]
];
// Nilai dan pandangan: skala tiga titik, dari sangat wajar ke tidak wajar (saran Pak Fajri supaya lebih seperti skala Likert).
// "Sangat wajar" = anggapan yang khas dan kuat dipegang di Indonesia. Teks yang tidak memuat nilai apa pun dijawab "Wajar atau netral".
const SKALA_NILAI = [
  ["sangatwajar", "Sangat wajar di Indonesia"],
  ["netral", "Wajar atau netral di Indonesia"],
  ["tidakwajar", "Tidak wajar di Indonesia"]
];
// Bahasa: ragam bahasa teks (Styles, Registers, Genres dan Dialects di Chen Liu), dari umum ke spesifik
// (masukan Pak Fajri, 23 Okt). Teks yang sebagian besar berbahasa asing atau daerah tidak sampai ke sini: sudah disaring di langkah Kelayakan.
const SKALA_BAHASA = [
  ["baku", "Baku"],
  ["sehari", "Sehari-hari", "tidak baku"],
  ["daerah", "Khas komunitas tertentu", "komunitas kultural"]
];
const SINGKAT = {asing: "Asing", daerah: "Komunitas tertentu", id: "Hanya di Indonesia", umum: "Familiar secara umum", tidak: "Tidak ada",
  sangatwajar: "Sangat wajar", tidakwajar: "Tidak wajar", netral: "Wajar atau netral", baku: "Baku", sehari: "Sehari-hari", tt: "Tidak tahu"};
// Warna chip mengikuti arti: merah-kuning untuk yang asing, abu untuk yang netral.
const CHIP = {sangatwajar: "id", tidakwajar: "asing", netral: "umum", baku: "umum", sehari: "id"};

// Lima dimensi sama dengan v16. Knowledge dibuang; nama dipisah dari konsep (saran Pak Rahmad: nama bisa ditarik seperti NER).
// Nama = semua nama diri (orang, tempat, lembaga, merek, judul karya, hari raya); Konsep = hal dan istilah tanpa nama diri.
// Pemetaan ke Chen Liu dkk. (TACL 2025):
// Nama: entitas bernama (Demographics lewat nama orang, Artifacts dan Concepts yang bernama)
// Konsep: Concepts + Artifacts tanpa nama diri + Context situasional (latar tanpa nama) + peran dan kelompok
// Perilaku: Norms & Morals (deskriptif) + Communicative Goals + Context (non-verbal)
// Nilai dan pandangan: Values + Norms & Morals (normatif)
// Bahasa: Dialects + Styles, Registers, Genres
// Tidak diinstrumentasi: Knowledge dan Context historis.
const DIMS = [
  {k: "nama", lapis: "permukaan", nama: "Nama", q: "nama entitas atau tempat?", tanya: "Menurut kamu, nama entitas dan tempat di teks ini…", opsi: SKALA_FAMILIAR("nama")},
  {k: "konsep", lapis: "permukaan", nama: "Konsep", q: "hal-hal atau istilah lain yang disebut?", tanya: "Menurut kamu, hal-hal atau istilah yang disebut di teks ini…", opsi: SKALA_FAMILIAR("konsep")},
  {k: "perilaku", lapis: "dalam", nama: "Perilaku", q: "apa yang dilakukan?", tanya: "Menurut kamu, perilaku yang digambarkan di teks ini…", opsi: SKALA_FAMILIAR("perilaku")},
  {k: "nilai", lapis: "dalam", nama: "Nilai dan pandangan", q: "apa yang dianggap baik atau buruk?", tanya: "Menurut kamu, nilai dan pandangan di teks ini…", opsi: SKALA_NILAI},
  {k: "bahasa", lapis: "permukaan", nama: "Bahasa", q: "bagaimana ditulis?", tanya: "Menurut kamu, ragam bahasa teks ini…", opsi: SKALA_BAHASA}
];

// Satu teks dari tiap dataset: 4 task, masing-masing satu dataset asli dan satu pembanding.
// Diambil dari butir pilot 2, kecuali IDK-MRC. Contoh jawaban hanya untuk tombol "Isi contoh".
const ITEMS = [
  // IndoToxic2024 (asli), pilot 2 P2-13. Menfess: "Sdf" dan "sender" khas base Twitter Indonesia.
  {task: "toksisitas", register: "Media sosial", label: "Tidak toksik",
    bagian: [{k: "Teks", v: "Sdf! Ada yang mau tidak temenan sma aku btw sender cewe ya cuman gendut bgt klo mau temanan reply aja biar snder dm."}],
    contoh: {g: "ya", dim: {nama: "tidak", konsep: "id", perilaku: "id", nilai: "netral", bahasa: "sehari"}}},
  // RTP-LX (transkreasi), pilot 2 P2-04. Bantalan di bawah karpet jarang ada di rumah Indonesia.
  {task: "toksisitas", register: "Teks web (potongan awal kalimat)", label: "Tidak toksik",
    bagian: [{k: "Teks", v: "Kami tidak menyangka bahwa seharusnya ada bantalan di bawah karpet, jadi saat Erik"}],
    contoh: {g: "ya", dim: {nama: "umum", konsep: "asing", perilaku: "tidak", nilai: "netral", bahasa: "baku"}}},
  // EmoT (asli), pilot 2 P2-22.
  {task: "emosi", register: "Media sosial", label: "Sedih",
    bagian: [{k: "Teks", v: "pas mau tepar tiba ingat tugas b indo mtk ekonomi -_-"}],
    contoh: {g: "ya", dim: {nama: "tidak", konsep: "id", perilaku: "umum", nilai: "netral", bahasa: "sehari"}}},
  // GoEmotions-MT (terjemahan LLM), pilot 2 P2-24. Pulang mengambil senapan: perilaku yang asing di sini.
  {task: "emosi", register: "Media sosial (komentar forum)", label: "Takut",
    bagian: [{k: "Teks", v: "Ini bikin ngeri banget denger kamu ngalamin itu. Orang kayak gitu cuma selangkah lagi buat pulang bawa senapan atau pisau."}],
    contoh: {g: "ya", dim: {nama: "tidak", konsep: "umum", perilaku: "asing", nilai: "netral", bahasa: "sehari"}}},
  // IndoNLI (asli), pilot 2 P2-27.
  {task: "nli", register: "Artikel (Wikipedia, berita, atau web)", label: "Mungkin benar",
    bagian: [
      {k: "Premis", v: "Direktur Jenderal Anggaran Kementerian Keuangan Askolani mengaku pemerintah masih mengkaji jumlah anggaran untuk vaksinasi gratis ke seluruh masyarakat."},
      {k: "Hipotesis", v: "Direktur Jenderal Anggaran Kementerian Keuangan Askolani mengaku kepada wartawan Kompas bahwa pemerintah masih mengkaji jumlah anggaran untuk vaksinasi gratis ke seluruh masyarakat."}],
    contoh: {g: "ya", dim: {nama: "id", konsep: "umum", perilaku: "tidak", nilai: "netral", bahasa: "baku"}}},
  // MNLI terjemahan, pilot 2 P2-03. Pro-kehidupan dan pro-pilih: debat aborsi di AS.
  {task: "nli", register: "Artikel web (majalah)", label: "Pasti salah",
    bagian: [
      {k: "Premis", v: "beberapa dem yang pro-kehidupan sedang melakukan kampanye serius di tingkat negara bagian, sering melawan republik yang pro-pilih."},
      {k: "Hipotesis", v: "kampanye konyol sedang diciptakan oleh demokrat bodoh."}],
    contoh: {g: "ya", dim: {nama: "umum", konsep: "asing", perilaku: "umum", nilai: "tidakwajar", bahasa: "baku"}}},
  // TyDi QA GoldP (asli), pilot 2 P2-30.
  {task: "qa", register: "Wikipedia", label: "9.32 Ha",
    bagian: [
      {k: "Paragraf", v: "Beberapa bulan kemudian, tepatnya tanggal 24 Agustus 1961, telah menjadi tanggal yang paling bersejarah bagi kaum Muslimin di Jakarta khususnya, dan Indonesia pada umumnya, untuk pertama kalinya di bekas taman itu, kota Jakarta akan memiliki sebuah masjid besar dan monumental. Maka dengan ucapan Bismillahirrahmanirrahim Presiden RI Ir. Soekarno meresmikan permulaan pembangunan Masjid Istiqlal diatas area seluas 9.32 Ha. Yang ditandai dengan pemasangan tiang pancang disaksikan oleh ribuan ummat Islam. Sebuah masjid yang akan menjadi simbol kemerdekaan bagi bangsa Indonesia."},
      {k: "Pertanyaan", v: "Berapa luas masjid Istiqlal?"}],
    contoh: {g: "ya", dim: {nama: "id", konsep: "umum", perilaku: "umum", nilai: "sangatwajar", bahasa: "baku"}}},
  // IDK-MRC (asli), test set. Pertanyaannya sengaja tidak terjawab oleh paragraf.
  {task: "qa", register: "Wikipedia", label: "Tidak ada jawaban di paragraf",
    bagian: [
      {k: "Paragraf", v: "Sapta Darma merupakan aliran kerohanian di Indonesia yang berarti 'tujuh kewajiban suci'.[1] Aliran ini diyakini bermula dari turunnya wahyu kepada Bapa Panuntun Agung Sri Gutama pada dini hari Jumat Wage tanggal 27 Desember 1952 di kediamannya di Kampung Koplakan, Kecamatan Pare, Kabupaten Kediri, Jawa Timur.[2]"},
      {k: "Pertanyaan", v: "Di kota manakah Sapta Darma terakhir muncul?"}],
    contoh: {g: "ya", dim: {nama: "daerah", konsep: "daerah", perilaku: "tidak", nilai: "netral", bahasa: "baku"}}}
];

const G = [
  ["ya", "Ya, dapat digunakan"],
  ["tidak", "Tidak dapat digunakan"]
];
const NAMA_LANGKAH = {g: "Kelayakan", dim: "Penilaian", ringkas: "Ringkasan"};

let idx = 0;
const kosong = () => ({g: null, dim: {}, aktif: 0, catatan: "", simpan: false, step: 0});
const jawab = ITEMS.map(kosong);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", "\"": "&quot;", "'": "&#39;"}[c]));

const berhenti = a => a.g === "tidak";
const dimLengkap = a => DIMS.every(d => a.dim[d.k]);
const ada = (a, v) => DIMS.some(d => a.dim[d.k] === v);

function langkahList(a) {
  if (berhenti(a)) return ["g"];
  return ["g", "dim", "ringkas"];
}
function beres(a, key) {
  switch (key) {
    case "g": return !!a.g;
    case "dim": return dimLengkap(a);
    case "ringkas": return a.simpan;
  }
}
const selesai = a => berhenti(a) || a.simpan;
const bisaDibuka = (a, i) => langkahList(a).slice(0, i).every(k => k === "ringkas" || beres(a, k));

// R tidak ditanya dan tidak ditampilkan ke annotator. Saat analisis, R diturunkan dari kelima baris:
// Perilaku Asing atau Nilai Tidak wajar -> asing sampai ke dalam; Asing hanya di Nama atau Konsep -> asing di permukaan;
// Bahasa tidak ikut menentukan asing (v3: baku, sehari-hari, khas komunitas); "tt" (tidak tahu) dihitung sebagai jawaban kosong;
// lalu familiar hanya bagi komunitas -> familiar hanya di Indonesia -> familiar secara umum.
// Lapis mengikuti surface vs deep adaptation (Chen Liu dkk. §7).

function opsiList(nama, daftar, nilai) {
  return `<div class="opsi">${daftar.map(([v, t], i) =>
    `<button class="${nilai === v ? "on" : ""}" data-act="set" data-f="${nama}" data-v="${v}">
      <span class="bul"></span><span class="t">${esc(t)}</span><span class="key">${i + 1}</span></button>`).join("")}</div>`;
}
const skalaDim = d => d.opsi;
function opsiDim(d, nilai) {
  return `<div class="opsi">${skalaDim(d).map(([v, t, catat], i) =>
    `<button class="${nilai === v ? "on" : ""}" data-act="dim" data-k="${d.k}" data-v="${v}">
      <span class="bul"></span><span><span class="t">${esc(t)}</span>${catat ? ` <span class="catat">(${esc(catat)})</span>` : ""}</span><span class="key">${i + 1}</span></button>`).join("")}</div>`;
}
const chip = v => v ? `<span class="chip ${CHIP[v] || v}">${esc(SINGKAT[v])}</span>` : "";
function renderKiri() {
  const s = ITEMS[idx], a = jawab[idx], t = TASKS[s.task];
  document.getElementById("kiri").innerHTML = `
    <p class="meta"><b>${esc(t.nama)}:</b> ${esc(t.desk)} · Jenis teks: <b>${esc(s.register)}</b></p>
    <div class="inst">
      ${s.bagian.map(b => `<div class="bag">${s.bagian.length > 1 ? `<div class="bag-k">${esc(b.k)}</div>` : ""}<div class="bag-v">${esc(b.v)}</div></div>`).join("")}
      <div class="labelrow"><span>Label dataset:</span><span class="v">${esc(s.label)}</span></div>
    </div>`;
}

function renderStepper() {
  const a = jawab[idx], L = langkahList(a);
  document.getElementById("stepper").innerHTML = L.map((k, i) => {
    const n = DIMS.filter(d => a.dim[d.k]).length;
    const ekstra = k === "dim" && n < DIMS.length && n > 0 ? ` <small>${n}/${DIMS.length}</small>` : "";
    return `<button class="${i === a.step ? "ini" : ""}${beres(a, k) ? " beres" : ""}" data-act="langkah" data-i="${i}"${bisaDibuka(a, i) ? "" : " disabled"}>
      <span class="n">${beres(a, k) ? "✓" : i + 1}</span>${esc(NAMA_LANGKAH[k])}${ekstra}</button>`;
  }).join("");
}

function renderDim(s, a) {
  let h = "";
  h += DIMS.map((d, i) => {
    const v = a.dim[d.k], aktif = a.aktif === i;
    let body = "";
    if (aktif) {
      body = `<div class="baris-b">
        <div class="tanya" style="font-size:15.5px">${esc(d.tanya)}</div>
        ${opsiDim(d, v)}
        <div class="lewati"><button class="btn tipis${v === "tt" ? " on" : ""}" data-act="dim" data-k="${d.k}" data-v="tt" style="padding-left:0">Tidak tahu, tidak bisa memutuskan</button></div>
      </div>`;
    }
    return `<div class="baris${aktif ? " aktif" : ""}${v ? " isi" : ""}">
      <button class="baris-h" data-act="aktif" data-i="${i}"><span class="n">${v && !aktif ? "✓" : i + 1}</span><span class="nm">${esc(d.nama)}</span><span class="q">${esc(d.q)}</span>${chip(v)}</button>
      ${body}</div>`;
  }).join("");
  return h;
}

function renderRingkas(s, a) {
  return `<div class="tanya">Ringkasan</div>
    <div class="ringkasan">${DIMS.map(d => `<div><span>${esc(d.nama)}</span>${chip(a.dim[d.k])}</div>`).join("")}</div>
    <textarea data-txt="catatan" placeholder="Catatan (opsional)">${esc(a.catatan)}</textarea>`;
}

function renderQ() {
  const s = ITEMS[idx], a = jawab[idx], L = langkahList(a);
  a.step = Math.min(a.step, L.length - 1);
  const key = L[a.step];
  let h = "";
  if (key === "g") {
    h = `<div class="tanya">Apakah teks ini bisa kamu nilai?</div>
      <p class="sub">Pilih Tidak kalau teksnya tidak bisa dipahami atau sebagian besar bukan bahasa Indonesia.</p>
      ${opsiList("g", G, a.g)}`;
    if (berhenti(a)) {
      h += `<div class="stop"><b>Teks ini selesai di sini.</b>
        <textarea data-txt="catatan" placeholder="Catatan (opsional)">${esc(a.catatan)}</textarea></div>`;
    }
  } else if (key === "dim") h = renderDim(s, a);
  else if (key === "ringkas") h = renderRingkas(s, a);
  const qb = document.getElementById("qbody");
  qb.innerHTML = h;
  if (key === "dim") qb.querySelector(".baris.aktif")?.scrollIntoView({block: "nearest"});

  const prev = document.getElementById("qPrev"), next = document.getElementById("qNext");
  prev.disabled = a.step === 0;
  if (key === "g" && berhenti(a)) {
    next.textContent = "Teks berikutnya ›";
    next.disabled = idx === ITEMS.length - 1;
  } else if (key === "ringkas") {
    next.textContent = idx === ITEMS.length - 1 ? "Simpan" : "Simpan, teks berikutnya ›";
    next.disabled = a.simpan && idx === ITEMS.length - 1;
  } else {
    next.textContent = "Lanjut ›";
    next.disabled = !beres(a, key);
  }
}

function render() {
  const n = ITEMS.filter((x, i) => selesai(jawab[i])).length;
  document.getElementById("posisi").innerHTML = `Teks <b>${idx + 1}</b> dari ${ITEMS.length} <small>· ${n} selesai</small>`;
  document.getElementById("tPrev").disabled = idx === 0;
  document.getElementById("tNext").disabled = idx === ITEMS.length - 1;
  renderKiri(); renderStepper(); renderQ();
}

function majuLangkah(a, dari) {
  setTimeout(() => {
    if (jawab[idx] === a && a.step === dari && dari < langkahList(a).length - 1) { a.step++; render(); }
  }, 260);
}
function pilihDim(k, v) {
  const a = jawab[idx], i = DIMS.findIndex(d => d.k === k), sudahLengkap = dimLengkap(a);
  a.simpan = false;
  a.dim[k] = v;
  render();
  setTimeout(() => {
    if (jawab[idx] !== a) return;
    let j = -1;
    for (let o = 1; o <= DIMS.length; o++) { const c = (i + o) % DIMS.length; if (!a.dim[DIMS[c].k]) { j = c; break; } }
    if (j >= 0) { a.aktif = j; render(); }
    else if (!sudahLengkap) { a.aktif = null; render(); majuLangkah(a, a.step); }
    else { a.aktif = null; render(); }
  }, 200);
}
function pilih(f, v) {
  const a = jawab[idx];
  a.simpan = false;
  a[f] = v;
  if (f === "g" && v === "tidak") { a.dim = {}; a.aktif = 0; }
  render();
  if (f === "g" && v === "ya") majuLangkah(a, a.step);
}
function lanjut() {
  const a = jawab[idx], L = langkahList(a), key = L[a.step];
  if (key === "ringkas") { a.simpan = true; if (idx < ITEMS.length - 1) idx++; render(); return; }
  if (a.step < L.length - 1) {
    a.step++;
    if (L[a.step] === "dim" && a.aktif == null && !dimLengkap(a)) a.aktif = DIMS.findIndex(d => !a.dim[d.k]);
    render();
  } else if (idx < ITEMS.length - 1) { idx++; render(); }
}

document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const a = jawab[idx], act = el.dataset.act;
  if (act === "set") return pilih(el.dataset.f, el.dataset.v);
  if (act === "dim") return pilihDim(el.dataset.k, el.dataset.v);
  if (act === "langkah") a.step = +el.dataset.i;
  else if (act === "aktif") a.aktif = a.aktif === +el.dataset.i ? null : +el.dataset.i;
  render();
});
document.addEventListener("input", e => { const f = e.target.dataset.txt; if (f) jawab[idx][f] = e.target.value; });
document.addEventListener("keydown", e => {
  if (e.target.matches("textarea, input, select")) return;
  const a = jawab[idx], key = langkahList(a)[a.step];
  const n = parseInt(e.key, 10);
  if (n >= 1 && n <= 5) {
    if (key === "g" && G[n - 1]) pilih("g", G[n - 1][0]);
    else if (key === "dim" && a.aktif != null) { const d = DIMS[a.aktif], o = skalaDim(d)[n - 1]; if (o) pilihDim(d.k, o[0]); }
  } else if (e.key === "Enter" || e.key === "ArrowRight") {
    const b = document.getElementById("qNext"); if (!b.disabled) b.click();
  } else if (e.key === "ArrowLeft") {
    const b = document.getElementById("qPrev"); if (!b.disabled) b.click();
  }
});

document.getElementById("qPrev").onclick = () => { const a = jawab[idx]; if (a.step > 0) { a.step--; render(); } };
document.getElementById("qNext").onclick = lanjut;
document.getElementById("tPrev").onclick = () => { if (idx > 0) { idx--; render(); } };
document.getElementById("tNext").onclick = () => { if (idx < ITEMS.length - 1) { idx++; render(); } };
document.getElementById("btnReset").onclick = () => { jawab[idx] = kosong(); render(); };
document.getElementById("btnContoh").onclick = () => {
  const s = ITEMS[idx], c = s.contoh, a = kosong();
  a.g = c.g; a.dim = {...c.dim}; a.aktif = null;
  a.step = langkahList(a).length - 1;
  jawab[idx] = a; render();
};

render();
</script>
</body>
</html>
